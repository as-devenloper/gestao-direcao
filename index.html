<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#0b7a4b;--bad:#c0392b;--bd:#e2e5e9;--lu:#e69500;--bl:#1e8fd6;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f25;--tx:#eceff3;--mut:#9aa3ae;--ac:#3ddc97;--bad:#ff7b6b;--bd:#2a313a;--lu:#ffb703;--bl:#5cc8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101317;--card:#1a1f25;--tx:#eceff3;--mut:#9aa3ae;--ac:#3ddc97;--bad:#ff7b6b;--bd:#2a313a;--lu:#ffb703;--bl:#5cc8ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 12px 100px}
h1{font-size:20px;margin:6px 0 10px}
.tabs,.seg{display:flex;gap:6px;margin:8px 0}
.tabs button,.seg button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on,.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.big{font-size:32px;font-weight:700}
.pos{color:var(--ac)}.neg{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.k small{display:block;color:var(--mut);font-size:12px}.k b{font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{-webkit-user-select:text;user-select:text;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}.row small{color:var(--mut);display:block}
.del{border:0;background:none;color:var(--bad);font-size:13px}
.hint{color:var(--mut);font-size:13px}
.lu,.hint b.lu{color:var(--lu)}
.bl{color:var(--bl)}
.card.tot{border:2px solid var(--ac)}
.acc{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;padding:0 14px}
.acc summary{display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer;list-style:none;font-weight:600}
.acc summary::-webkit-details-marker{display:none}
.acc summary span{flex:1}
.acc summary::after{content:"▾";color:var(--mut)}
.acc[open] summary::after{content:"▴"}
.acc .grid{margin-bottom:10px}
.hint b{color:var(--tx)}
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
.tabs:empty{display:none}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:11px;padding:4px 0;border-radius:0}
.tabs button.on{background:none;color:var(--ac);border:0}
.tabs svg{width:24px;height:24px}
</style></head><body><main>
<h1>🚕 Gestão Da Direção</h1>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyARw0UdcZUsBSEkvLYnZ1tIzmzg2RchqvY",authDomain:"gestao-direcao.firebaseapp.com",projectId:"gestao-direcao",storageBucket:"gestao-direcao.firebasestorage.app",messagingSenderId:"64954400977",appId:"1:64954400977:web:9846dc6a042b433e0c45f0"};
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let D=[],user=null,col=null,unsub=null,ready=false,err='',ed=null,fl=false,tab='res',per='mes',add='g',armed=null,msg='',lmsg='';
const fe=x=>x.code==='permission-denied'?'Sem permissão no Firestore. Publique as regras na aba Regras do Firestore e confira se está logado.':x.code==='unavailable'?'Sem conexão com o banco.':'Erro: '+(x.code||'')+' '+x.message;
auth.onAuthStateChanged(u=>{ready=true;user=u;if(unsub){unsub();unsub=null}D=[];
 if(u){col=db.collection('users').doc(u.uid).collection('lancamentos');
  unsub=col.onSnapshot(s=>{D=s.docs.map(x=>({...x.data(),id:x.id}));err='';draw()},e=>{err=fe(e);draw()})}
 draw()});
function login(){return `<div class="card"><b>Entrar</b><label>E-mail</label><input id="em" type="email" autocomplete="email"><label>Senha</label><input id="pw" type="password" autocomplete="current-password">
 <button class="go" onclick="ent(0)">Entrar</button><button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="ent(1)">Criar conta</button><p class="hint">${esc(lmsg)}</p></div>`}
function ent(n){const e=document.getElementById('em').value.trim(),p=document.getElementById('pw').value;lmsg='';
 (n?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).catch(x=>{lmsg=x.message;draw()})}
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=(v,d=1)=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const fd=s=>s.split('-').reverse().slice(0,2).join('/');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((s,e)=>s+f(e),0);
const mk=(el,d,sep)=>{let x=el.value.replace(/\D/g,'').replace(/^0+/,'');if(!x){el.value='';cl();return}x=x.padStart(d+1,'0');el.value=x.slice(0,-d)+sep+x.slice(-d);cl()};
const cl=()=>{const l=document.getElementById('lt');if(l){const p=num('p'),v=num('v');l.value=p>0&&v>0?(v/p).toFixed(2):''}if(document.getElementById('gc'))cg()};
const lastP=()=>{const a=D.filter(e=>e.t==='a').sort((x,y)=>y.d.localeCompare(x.d)||(y.ts||0)-(x.ts||0))[0];return a?a.p:0};
const br=x=>x.toFixed(2).replace('.',',');
function cg(){const gc=document.getElementById('gc'),lc=document.getElementById('lc'),h=document.getElementById('gh');
 const a=D.filter(e=>e.t==='a').sort((x,y)=>y.d.localeCompare(x.d)||(y.ts||0)-(x.ts||0))[0],p=a?a.p:0,v=num('v'),k=num('k'),kl=num('kl');
 h.textContent=p?'Usando o preço do último abastecimento: '+R(p)+'/L':'Lance um abastecimento para calcular o gasto.';
 if(p>0&&k>0&&kl>0){const c=k/kl*p;gc.value=br(c);lc.value=v>0?br(v-c):''}else{gc.value='';lc.value=''}}
const num=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'))||0;
function start(){const n=new Date(),t=today();if(per==='dia')return t;if(per==='sem'){n.setDate(n.getDate()-((n.getDay()+6)%7));return iso(n)}if(per==='mes')return t.slice(0,7)+'-01';return '0000'}
function stats(){const s=start(),P=D.filter(e=>e.d>=s),g=P.filter(e=>e.t==='g'),a=P.filter(e=>e.t==='a'),x=P.filter(e=>e.t==='d');
 const ganho=sum(g,e=>e.v),comb=sum(a,e=>e.v),desp=sum(x,e=>e.v),lucro=ganho-comb-desp;
 const km=sum(g,e=>e.k||0),dias=new Set(g.map(e=>e.d)).size,lit=sum(a,e=>e.v/e.p);
 const gk=g.filter(e=>e.k>0&&e.kl>0),cons=gk.length?sum(gk,e=>e.k)/sum(gk,e=>e.k/e.kl):0;const src={};g.forEach(e=>src[e.s]=(src[e.s]||0)+e.v);
 return{ganho,comb,desp,lucro,km,dias,lit,src,margem:ganho>0?lucro/ganho*100:0,pl:lit>0?comb/lit:0,c:cons}}
const op={};
const srt=a=>[...a].sort((a,b)=>b.d.localeCompare(a.d)||(b.ts||0)-(a.ts||0));
const priceAt=d=>{const a=srt(D.filter(e=>e.t==='a')),b=a.find(x=>x.d<=d)||a[a.length-1];return b?b.p:0};
function rowOf(e,x){let t,P=[fd(e.d)];
 if(e.t==='g'){t=`💰 ${esc(e.s)}`;if(e.k>0)P.push(e.k.toFixed(1)+' km');if(e.kl>0)P.push(e.kl.toFixed(1)+' km/L');
  let gc=e.gc,lc=e.lc;if(gc==null&&e.k>0&&e.kl>0){const pl=priceAt(e.d);if(pl>0){gc=e.k/e.kl*pl;lc=e.v-gc}}
  if(gc!=null)P.push('Combustível '+R(gc),`Lucro <b class="${lc>=0?'pos':'neg'}">${R(lc)}</b>`)}
 if(e.t==='a'){t=`⛽ Abastecimento`;P.push((e.v/e.p).toFixed(2)+' L a '+R(e.p))}
 if(e.t==='d'){t=`🧾 ${esc(e.c)}`;if(e.n)P.push(esc(e.n))}
 return `<div class="row"><div>${t}<small>${P.join(' · ')}</small></div><div style="text-align:right"><b class="${e.t==='g'?'pos':'neg'}">${e.t==='g'?'+':'−'}${R(e.v)}</b>${x?`<br><button class="del" style="color:var(--ac);margin-right:14px" onclick="edit('${e.id}')">Editar</button><button class="del" onclick="del('${e.id}')">${armed==e.id?'Confirmar?':'Excluir'}</button>`:''}</div></div>`}
function acc(k,t,tot,cls,body){return `<details class="acc" ${op[k]?'open':''} ontoggle="op['${k}']=this.open"><summary><span>${t}</span><b class="${cls}">${tot}</b></summary>${body}</details>`}
const wd=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const bad=m=>{msg=m;const x=document.getElementById('msg');if(x)x.textContent=m};
const m2=x=>(+x).toFixed(2).replace('.',',');
function daily(P){const m={};P.forEach(e=>{const x=m[e.d]||(m[e.d]={d:e.d,g:0,c:0,x:0});if(e.t==='g')x.g+=e.v;else if(e.t==='a')x.c+=e.v;else x.x+=e.v});return Object.values(m).map(x=>({...x,l:x.g-x.c-x.x})).sort((a,b)=>a.d.localeCompare(b.d))}
function chart(days){const a=days.slice(-14);if(!a.length)return '<p class="hint">Sem dados no período.</p>';
 const mx=Math.max(...a.map(x=>Math.abs(x.l)),1),W=300,H=120,bw=W/a.length,z=H/2;
 const bars=a.map((x,i)=>{const h=Math.abs(x.l)/mx*(z-12),y=x.l>=0?z-h:z;return `<rect x="${i*bw+bw*.15}" y="${y}" width="${bw*.7}" height="${Math.max(h,1)}" rx="3" fill="${x.l>=0?'var(--ac)':'var(--bad)'}"/><text x="${i*bw+bw/2}" y="${H+12}" font-size="8" text-anchor="middle" fill="var(--mut)">${x.d.slice(8)}</text>`}).join('');
 return `<svg viewBox="0 0 ${W} ${H+16}" width="100%"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--bd)"/>${bars}</svg>`}
function edit(id){const e=D.find(x=>String(x.id)===id);if(!e)return;ed=e;add=e.t;tab='add';armed=null;msg='';fl=true;draw();scrollTo(0,0)}
function fill(){if(!ed||tab!=='add')return;const g=id=>document.getElementById(id),set=(id,v)=>{if(g(id)&&v!=null&&v!=='')g(id).value=v};
 ['s','c'].forEach(i=>{const o=g(i),v=ed[i];if(o&&v&&![...o.options].some(x=>x.value===v))o.add(new Option(v,v))});
 set('d',ed.d);set('v',m2(ed.v));set('p',ed.p?m2(ed.p):null);set('k',ed.k?ed.k.toFixed(1):null);set('kl',ed.kl?ed.kl.toFixed(1):null);set('s',ed.s);set('c',ed.c);set('n',ed.n)}
function resumo(){const S=stats(),P=D.filter(e=>e.d>=start()),c=S.c,lucro=S.ganho-S.comb,total=lucro-S.desp;
 const seg=[['dia','Hoje'],['sem','Semana'],['mes','Mês'],['tudo','Tudo']].map(([k,t])=>`<button class="${per===k?'on':''}" onclick="per='${k}';draw()">${t}</button>`).join('');
 const k=(t,v)=>`<div class="k"><small>${t}</small><b>${v}</b></div>`;
 const list=t=>srt(P.filter(e=>e.t===t)).map(e=>rowOf(e,0)).join('')||'<p class="hint">Nada neste período.</p>';
 const srcs=Object.entries(S.src).map(([n,v])=>`<div class="row"><span>${esc(n)}</span><b>${R(v)}</b></div>`).join('')||'<p class="hint">Nenhum ganho lançado neste período.</p>';
 const ind=`<div class="grid">${k('Lucro por dia trabalhado',S.dias?R(total/S.dias):'—')}${k('Margem',S.ganho>0?N(total/S.ganho*100)+'%':'—')}
 ${k('Consumo médio',c?N(c)+' km/L':'—')}${k('Preço médio do litro',S.pl?R(S.pl):'—')}
 ${k('Ganho por km',S.km?R(S.ganho/S.km):'—')}${k('Lucro por km',S.km?R(total/S.km):'—')}
 ${k('Combustível por km',c&&S.pl?R(S.pl/c):'—')}${k('Km informados',S.km?N(S.km,0)+' km':'—')}</div>
 <b>Ganhos por origem</b>${srcs}<p class="hint">Consumo médio, ganho e lucro por km usam os km e o km/L informados em cada ganho.</p>`;
 const dl=daily(P),wk=dl.filter(x=>x.g>0),best=wk.length?wk.reduce((a,b)=>b.l>a.l?b:a):null,worst=wk.length>1?wk.reduce((a,b)=>b.l<a.l?b:a):null,so=Object.entries(S.src).sort((a,b)=>b[1]-a[1])[0];
 const dk=(ic,t,x)=>x?`<div class="k"><small>${ic} ${t}</small><b class="${x.l>=0?'pos':'neg'}">${R(x.l)}</b><small>${wd(x.d)} ${fd(x.d)}</small></div>`:`<div class="k"><small>${ic} ${t}</small><b>—</b></div>`;
 return `<div class="seg">${seg}</div>
 <div class="card tot"><small class="hint">Lucro Líquido</small><div class="big ${total>=0?'pos':'neg'}">${R(total)}</div><div class="hint">${S.dias} dia(s) trabalhado(s)${S.dias?' · média '+R(total/S.dias)+'/dia':''}</div></div>
 <div class="grid"><div class="k"><small>💵 Receitas</small><b class="${lucro>=0?'bl':'neg'}">${R(lucro)}</b></div><div class="k"><small>🧾 Despesas</small><b class="neg">${R(S.desp)}</b></div>
 ${dk('🏆','Dia mais lucrativo',best)}${dk('📉','Dia de menor lucro',worst)}
 <div class="k"><small>🚕 Melhor origem</small><b>${so?esc(so[0]):'—'}</b><small>${so?R(so[1]):''}</small></div><div class="k"><small>⛽ Combustível gasto</small><b class="neg">${R(S.comb)}</b></div></div>
 <div class="card"><b>Lucro por dia</b>${chart(dl)}</div>
 ${acc('g','💰 Ganhos',R(S.ganho),'pos',list('g'))}
 ${acc('a','⛽ Abastecimentos',R(S.comb),'neg',list('a'))}
 ${acc('d','🧾 Despesas',R(S.desp),'neg',list('d'))}
 ${acc('i','📊 Indicadores','','',ind)}`}
function lancar(){
 const seg=[['g','💰 Ganho'],['a','⛽ Abastecer'],['d','🧾 Despesa']].map(([k,t])=>`<button class="${add===k?'on':''}" onclick="add='${k}';msg='';draw()">${t}</button>`).join('');
 let f='';
 if(add==='g')f=`<label>Origem</label><select id="s"><option>Aplicativos (99 / Uber)</option><option>Viagem Intermunicipal</option><option>Frete</option><option>Encomendas</option><option>Gorjeta</option><option>Outros</option></select>
  <label>Valor recebido (R$)</label><input id="v" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <label>Km rodados (opcional)</label><input id="k" type="text" inputmode="numeric" placeholder="0000.0" oninput="mk(this,1,'.')" autocomplete="off">
  <label>Consumo médio nesta corrida (km/L)</label><input id="kl" type="text" inputmode="numeric" placeholder="00.0" oninput="mk(this,1,'.')" autocomplete="off">
  <label>Gasto com combustível (calculado)</label><input id="gc" type="text" placeholder="0,00" readonly>
  <label>Lucro nesta corrida (calculado)</label><input id="lc" type="text" placeholder="0,00" readonly>
  <p class="hint" id="gh"></p>`;
 if(add==='a')f=`<label>Preço do litro (R$)</label><input id="p" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <label>Valor abastecido (R$)</label><input id="v" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <label>Litros abastecidos (calculado)</label><input id="lt" type="text" placeholder="00.00" readonly>`;
 if(add==='d')f=`<label>Categoria</label><select id="c"><option>Manutenção</option><option>Lavagem</option><option>Pedágio</option><option>Alimentação</option><option>Parcela/Aluguel</option><option>Seguro/IPVA</option><option>Outro</option></select>
  <label>Valor (R$)</label><input id="v" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <label>Observação</label><input id="n" type="text">`;
 return `${ed?'':`<div class="seg">${seg}</div>`}<div class="card">${ed?'<b>✏️ Editando lançamento</b>':''}<label>Data</label><input id="d" type="date" value="${today()}">${f}
 <button class="go" onclick="addIt()">${ed?'Salvar alterações':'Salvar'}</button>${ed?`<button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="ed=null;tab='his';draw()">Cancelar</button>`:''}<p class="hint" id="msg">${msg}</p></div>`}
function addIt(){const e={ts:ed?ed.ts:Date.now(),t:add,d:document.getElementById('d').value||today(),v:num('v')};
 if(e.v<=0){return bad('Informe o valor.')}
 if(add==='g'){e.s=document.getElementById('s').value;e.k=num('k');e.kl=num('kl');const p=ed?priceAt(e.d):lastP();if(p>0&&e.k>0&&e.kl>0){e.pl=p;e.gc=+(e.k/e.kl*p).toFixed(2);e.lc=+(e.v-e.gc).toFixed(2)}}
 if(add==='a'){e.p=num('p');if(e.p<=0){return bad('Informe o preço do litro.')}}
 if(add==='d'){e.c=document.getElementById('c').value;e.n=document.getElementById('n').value}
 if(ed){e.id=ed.id;D=D.map(x=>x.id===e.id?e:x);col.doc(e.id).set(e).catch(x=>{err=fe(x);draw()});ed=null;tab='his';msg='';return draw()}
 const ref=col.doc();e.id=ref.id;D.push(e);ref.set(e).catch(x=>{err=fe(x);draw()});msg='✔ Salvo!';
 if(add==='a'){msg+=` ${N(e.v/e.p,2)} L`}
 draw()}
function hist(){const rows=srt(D).slice(0,100).map(e=>rowOf(e,1)).join('')||'<p class="hint">Sem lançamentos ainda.</p>';
 return `<div class="card">${rows}</div>
 <button class="go" style="background:var(--card);color:var(--bad);border:1px solid var(--bd)" onclick="auth.signOut()">Sair da conta</button>`}
function del(id){if(armed==id){D=D.filter(e=>String(e.id)!==id);col.doc(id).delete();armed=null}else armed=id;draw()}
function draw(){
 if(!ready){document.getElementById('view').innerHTML='<p class="hint">Carregando…</p>';return}
