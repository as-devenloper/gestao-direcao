<style>

:root[data-theme="dark"]{--bg:#101317;--card:#1a1f25;--tx:#eceff3;--mut:#9aa3ae;--ac:#3ddc97;--bad:#ff7b6b;--bd:#2a313a;--lu:#ffb703;--bl:#5cc8ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 12px 100px}
h1{font-size:20px;margin:6px 0 10px}
.tabs,.seg{display:flex;gap:6px;margin:8px 0}
.tabs button,.seg button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on,.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}

.big{font-size:32px;font-weight:700}
.pos{color:var(--ac)}.neg{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.k small{display:block;color:var(--mut);font-size:12px}.k b{font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{-webkit-user-select:text;user-select:text;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}.row small{color:var(--mut);display:block}
.del{border:0;background:none;color:var(--bad);font-size:13px}
.hint{color:var(--mut);font-size:13px}
.lu,.hint b.lu{color:var(--lu)}
.bl{color:var(--bl)}
.card.tot{border:2px solid var(--ac)}
.acc{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;padding:0 14px}
.acc summary{display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer;list-style:none;font-weight:600}
.acc summary::-webkit-details-marker{display:none}
.acc summary span{flex:1}
.acc summary::after{content:"▾";color:var(--mut)}
.acc[open] summary::after{content:"▴"}
.acc .grid{margin-bottom:10px}
.hint b{color:var(--tx)}
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
.tabs:empty{display:none}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:11px;padding:4px 0;border-radius:0}
.tabs button.on{background:none;color:var(--ac);border:0}
.tabs svg{width:24px;height:24px}
.hb{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;font-size:12px;line-height:1.2;margin:7px 0}
.hb .tr{background:var(--bg);border-radius:6px;height:12px;overflow:hidden}
.hb i{display:block;height:100%;border-radius:6px;min-width:2px}
.hb b{font-size:13px}
.mn{width:44px;height:44px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:24px;line-height:1}
.mn:disabled{opacity:.35}
.hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.logo{height:44px;width:auto}
.so{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.so svg{width:18px;height:18px}
.so[hidden]{display:none}
.oi{width:24px;height:24px;vertical-align:middle;margin-right:6px;border-radius:7px}
.og{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ot{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font:inherit;font-size:11px;line-height:1.15;text-align:center}
.ot.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.ot .oi{width:38px;height:38px;margin:0}
.hb .oi{width:16px;height:16px;margin-right:4px}
</style></head><body><main>
<header class="hd"><svg class="logo" viewBox="0 0 176 48" role="img" aria-label="Gestão Da Direção"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14a86c"/><stop offset="1" stop-color="#0a6b42"/></linearGradient></defs>
<rect width="48" height="48" rx="13" fill="url(#lg)"/><circle cx="24" cy="24" r="13" fill="none" stroke="#fff" stroke-width="3.4"/><path d="M24 11A13 13 0 0 1 37 24" fill="none" stroke="#ffb703" stroke-width="3.4" stroke-linecap="round"/>
<path d="M12 24h24M24 24v12.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="4.2" fill="#fff"/><circle cx="24" cy="24" r="1.8" fill="#0b7a4b"/>
<text x="58" y="24" font-size="24" font-weight="800" textLength="112" lengthAdjust="spacing" fill="var(--tx)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">GESTÃO</text>
<text x="58" y="40" font-size="12" font-weight="700" textLength="112" lengthAdjust="spacing" fill="var(--lu)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">DA DIREÇÃO</text></svg>
<button id="so" class="so" onclick="auth.signOut()" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sair</button></header>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>

<script>
const FB={apiKey:"AIzaSyARw0UdcZUsBSEkvLYnZ1tIzmzg2RchqvY",authDomain:"gestao-direcao.firebaseapp.com",projectId:"gestao-direcao",storageBucket:"gestao-direcao.firebasestorage.app",messagingSenderId:"64954400977",appId:"1:64954400977:web:9846dc6a042b433e0c45f0"};
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let D=[],user=null,col=null,unsub=null,ready=false,err='',ed=null,fl=false,pf='',pt='',pm='',tab='res',per='mes',add='g',armed=null,msg='',lmsg='';
const fe=x=>x.code==='permission-denied'?'Sem permissão no Firestore. Publique as regras na aba Regras do Firestore e confira se está logado.':x.code==='unavailable'?'Sem conexão com o banco.':'Erro: '+(x.code||'')+' '+x.message;
auth.onAuthStateChanged(u=>{ready=true;user=u;if(unsub){unsub();unsub=null}D=[];
 if(u){col=db.collection('users').doc(u.uid).collection('lancamentos');
  unsub=col.onSnapshot(s=>{D=s.docs.map(x=>({...x.data(),id:x.id}));err='';draw()},e=>{err=fe(e);draw()})}
 draw()});
function login(){return `<div class="card"><b>Entrar</b><label>E-mail</label><input id="em" type="email" autocomplete="email"><label>Senha</label><input id="pw" type="password" autocomplete="current-password">
 <button class="go" onclick="ent(0)">Entrar</button><button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="ent(1)">Criar conta</button><p class="hint">${esc(lmsg)}</p></div>`}
function ent(n){const e=document.getElementById('em').value.trim(),p=document.getElementById('pw').value;lmsg='';
 (n?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).catch(x=>{lmsg=x.message;draw()})}
const R=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=(v,d=1)=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:d});

const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((s,e)=>s+f(e),0);
const mk=(el,d,sep)=>{let x=el.value.replace(/\D/g,'').replace(/^0+/,'');if(!x){el.value='';cl();return}x=x.padStart(d+1,'0');el.value=x.slice(0,-d)+sep+x.slice(-d);cl()};
const cl=()=>{const l=document.getElementById('lt');if(l){const p=num('p'),v=num('v');l.value=p>0&&v>0?(v/p).toFixed(2):''}if(document.getElementById('gc'))cg();if(document.getElementById('hm'))ch()};
const lastP=()=>{const a=D.filter(e=>e.t==='a').sort((x,y)=>y.d.localeCompare(x.d)||(y.ts||0)-(x.ts||0))[0];return a?a.p:0};
const br=x=>x.toFixed(2).replace('.',',');
function cg(){const gc=document.getElementById('gc'),lc=document.getElementById('lc'),h=document.getElementById('gh');
 const a=D.filter(e=>e.t==='a').sort((x,y)=>y.d.localeCompare(x.d)||(y.ts||0)-(x.ts||0))[0],p=a?a.p:0,v=num('v'),k=num('k'),kl=num('kl');
 h.textContent=p?'Usando o preço do último abastecimento: '+R(p)+'/L':'Lance um abastecimento para calcular o gasto.';
 if(p>0&&k>0&&kl>0){const c=k/kl*p;gc.value=br(c);lc.value=v>0?br(v-c):''}else{gc.value='';lc.value=''}}
const num=id=>parseFloat(String(document.getElementById(id).value).replace(',','.'))||0;
function start(){const n=new Date(),t=today();if(per==='dia')return t;if(per==='sem'){n.setDate(n.getDate()-((n.getDay()+6)%7));return iso(n)}if(per==='mes')return t.slice(0,7)+'-01';return '0000'}
const rng=()=>{let a=pf||pt,b=pt||pf;if(a>b)[a,b]=[b,a];return[a,b]};

const PM=()=>pm||today().slice(0,7);
function mv(n){const[y,m]=PM().split('-').map(Number),d=new Date(y,m-1+n,1),nm=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(nm>today().slice(0,7))return;pm=nm;per='mes';pf=pt='';draw()}
const inP=e=>{if(e.t==='r')return false;if(per==='mes')return e.d.slice(0,7)===PM();if(per!=='data')return e.d>=start();const[a,b]=rng();return e.d>=a&&e.d<=b};
function stats(){const P=D.filter(inP),g=P.filter(e=>e.t==='g'),a=P.filter(e=>e.t==='a'),x=P.filter(e=>e.t==='d');
 const ganho=sum(g,e=>e.v),comb=sum(a,e=>e.v),desp=sum(x,e=>e.v),lucro=ganho-comb-desp;
 const km=sum(g,e=>e.k||0),dias=new Set(g.map(e=>e.d)).size,lit=sum(a,e=>e.v/e.p);
 const gk=g.filter(e=>e.k>0&&e.kl>0),cons=gk.length?sum(gk,e=>e.k)/sum(gk,e=>e.k/e.kl):0;const src={};g.forEach(e=>src[e.s]=(src[e.s]||0)+e.v);
 return{ganho,comb,desp,lucro,km,dias,lit,src,margem:ganho>0?lucro/ganho*100:0,pl:lit>0?comb/lit:0,c:cons}}
const op={};
const srt=a=>[...a].sort((a,b)=>b.d.localeCompare(a.d)||(b.ts||0)-(a.ts||0));
const priceAt=d=>{const a=srt(D.filter(e=>e.t==='a')),b=a.find(x=>x.d<=d)||a[a.length-1];return b?b.p:0};
function rowOf(e,x){let t,P=[fd(e.d)];
 if(e.t==='g'){t=`${oi(e.s)}${esc(e.s)}`;if(e.vc)P.push(esc(e.vc));if(e.ps>0)P.push(e.ps+' passageiro'+(e.ps>1?'s':''));if(e.hm>0)P.push(e.hi+'–'+e.hf+' · '+fmtH(e.hm));if(e.k>0)P.push(e.k.toFixed(1)+' km');if(e.kl>0)P.push(e.kl.toFixed(1)+' km/L');
  let gc=e.gc,lc=e.lc;if(gc==null&&e.k>0&&e.kl>0){const pl=priceAt(e.d);if(pl>0){gc=e.k/e.kl*pl;lc=e.v-gc}}
  if(gc!=null)P.push('Combustível '+R(gc),`Lucro <b class="${lc>=0?'pos':'neg'}">${R(lc)}</b>`)}
 if(e.t==='a'){t=`⛽ Abastecimento${e.cb?' · '+e.cb:''}`;P.push((e.v/e.p).toFixed(2)+' L a '+R(e.p))}
 if(e.t==='d'){t=`🧾 ${esc(e.c)}`;if(e.n)P.push(esc(e.n))}
 return `<div class="row"><div>${t}<small>${P.join(' · ')}</small></div><div style="text-align:right"><b class="${e.t==='g'?'pos':'neg'}">${e.t==='g'?'+':'−'}${R(e.v)}</b>${x?`<br><button class="del" style="color:var(--ac);margin-right:14px" onclick="edit('${e.id}')">Editar</button><button class="del" onclick="del('${e.id}')">${armed==e.id?'Confirmar?':'Excluir'}</button>`:''}</div></div>`}
function acc(k,t,tot,cls,body){return `<details class="acc" ${op[k]?'open':''} ontoggle="op['${k}']=this.open"><summary><span>${t}</span><b class="${cls}">${tot}</b></summary>${body}</details>`}
const wd=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const bad=m=>{msg=m;const x=document.getElementById('msg');if(x)x.textContent=m};
const ORIG=['99','Uber','Entregas - Mercado Livre','Entregas - Shopee','Viagem Intermunicipal','Frete','Encomendas','Gorjeta','Outros'];
const G=(c,p)=>`<g transform="translate(4 4)" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</g>`;
const OI={
 '99':['#ffd400','<text x="16" y="22" font-size="16" font-weight="800" text-anchor="middle" fill="#111">99</text>'],
 'Uber':['#111',G('#fff','<path d="M3 13l1.8-4.6A2 2 0 0 1 6.7 7h10.6a2 2 0 0 1 1.9 1.4L21 13"/><rect x="2" y="13" width="20" height="5" rx="1.5"/><path d="M5 18v2.5M19 18v2.5"/><circle cx="7" cy="15.5" r=".6" fill="#fff"/><circle cx="17" cy="15.5" r=".6" fill="#fff"/>')],
 'Entregas - Mercado Livre':['#ffe600',G('#1b2b6b','<path d="M2 6h11v10H2z"/><path d="M13 9h4.5l3.5 3.5V16H13"/><circle cx="6.5" cy="17.5" r="2" fill="#ffe600"/><circle cx="17" cy="17.5" r="2" fill="#ffe600"/>')],
 'Entregas - Shopee':['#ee4d2d',G('#fff','<circle cx="5.5" cy="17" r="2.6"/><circle cx="18.5" cy="17" r="2.6"/><path d="M5.5 17h4l3-6h4l2 6"/><path d="M14 11l-1-3.5h-2.5"/><rect x="2" y="6" width="7" height="6" rx="1"/>')],
 'Viagem Intermunicipal':['#2b7fff',G('#fff','<path d="M2 21h20"/><path d="M4 21V10h6v11"/><path d="M10 21V4h7v17"/><path d="M17 21v-8h4v8"/><path d="M12.5 8h2M12.5 12h2M12.5 16h2M6.5 14h1"/>')],
 'Frete':['#7a4bd6',G('#fff','<circle cx="12" cy="7.5" r="2.7"/><path d="M7 20v-2.5a5 5 0 0 1 10 0V20"/><circle cx="4.5" cy="10.5" r="2"/><path d="M1.5 19.5V18a3.2 3.2 0 0 1 3.6-3.2"/><circle cx="19.5" cy="10.5" r="2"/><path d="M22.5 19.5V18a3.2 3.2 0 0 0-3.6-3.2"/>')],
 'Encomendas':['#b8742a',G('#fff','<rect x="3" y="14" width="8" height="7" rx="1"/><rect x="13" y="14" width="8" height="7" rx="1"/><rect x="8" y="6" width="8" height="8" rx="1"/><path d="M12 6v3M7 14v3M17 14v3"/>')],
 'Gorjeta':['#2e9e5b','<circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-width="1.8"/><text x="16" y="21.5" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">$</text>'],
 'Outros':['#6b7280','<circle cx="9" cy="16" r="1.8" fill="#fff"/><circle cx="16" cy="16" r="1.8" fill="#fff"/><circle cx="23" cy="16" r="1.8" fill="#fff"/>']};
const oi=n=>{const k=Object.keys(OI).find(x=>x.toLowerCase()===String(n).toLowerCase())||(String(n).startsWith('Aplicativos')?'Uber':'Outros'),[bg,gl]=OI[k];return `<svg class="oi" viewBox="0 0 32 32"><rect x=".5" y=".5" width="31" height="31" rx="9" fill="${bg}" stroke="#8886"/>${gl}</svg>`};
function og(){const sel=ed&&ed.s?ed.s:'99',L=ORIG.includes(sel)?ORIG:[...ORIG,sel];
 return `<input type="hidden" id="s" value="${esc(sel)}"><div class="og">${L.map(n=>`<button type="button" class="ot${n===sel?' on':''}" data-v="${esc(n)}" onclick="pick(this.dataset.v)">${oi(n)}<span>${esc(n)}</span></button>`).join('')}</div>`}
function pick(v){document.getElementById('s').value=v;const w=document.getElementById('psw');if(w)w.style.display=v==='Viagem Intermunicipal'?'block':'none';document.querySelectorAll('.ot').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
const mins=(a,b)=>{if(!a||!b)return 0;const[x,y]=a.split(':').map(Number),[u,w]=b.split(':').map(Number);let d=u*60+w-(x*60+y);if(d<0)d+=1440;return d};
const fmtH=m=>Math.floor(m/60)+'h'+String(Math.round(m%60)).padStart(2,'0');
function ch(){const h=document.getElementById('hm'),m=mins(document.getElementById('hi').value,document.getElementById('hf').value);if(h)h.value=m>0?fmtH(m):''}
const m2=x=>(+x).toFixed(2).replace('.',',');
function daily(P){const m={};P.forEach(e=>{const x=m[e.d]||(m[e.d]={d:e.d,g:0,c:0,x:0});if(e.t==='g')x.g+=e.v;else if(e.t==='a')x.c+=e.v;else x.x+=e.v});return Object.values(m).map(x=>({...x,l:x.g-x.c-x.x})).sort((a,b)=>a.d.localeCompare(b.d))}
function chart(days){const a=days.slice(-14);if(!a.length)return '<p class="hint">Sem dados no período.</p>';
 const mx=Math.max(...a.map(x=>Math.abs(x.l)),1),bw=60,W=Math.max(300,bw*a.length),H=120,o=(W-bw*a.length)/2,z=H/2;
 const bars=a.map((x,i)=>{const h=Math.abs(x.l)/mx*(z-16),y=x.l>=0?z-h:z,cx=o+i*bw+bw/2,col=x.l>=0?'var(--ac)':'var(--bad)',ty=x.l>=0?y-4:y+Math.max(h,1)+11;
  return `<rect x="${o+i*bw+bw*.25}" y="${y}" width="${bw*.5}" height="${Math.max(h,1)}" rx="3" fill="${col}"/><text x="${cx}" y="${ty}" font-size="9" font-weight="700" text-anchor="middle" fill="${col}">${R(x.l)}</text><text x="${cx}" y="${H+13}" font-size="9" text-anchor="middle" fill="var(--mut)">${fd(x.d)}</text>`}).join('');
 return `<div id="cs" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H+18}" width="${W>300?W:'100%'}"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--bd)"/>${bars}</svg></div>`}
function draft(){const g=i=>document.getElementById(i).value,hi=g('hi')||new Date().toTimeString().slice(0,5),ref=col.doc(),e={ts:Date.now(),t:'r',d:g('d')||today(),s:g('s'),vc:g('vc'),hi};
 const n=e.s==='Viagem Intermunicipal'?parseInt(g('ps'))||0:0;if(n>0)e.ps=n;
 e.id=ref.id;D.push(e);ref.set(e).catch(x=>{err=fe(x);draw()});msg='⏳ Rascunho salvo: início às '+hi;draw()}
function finish(id){const e=D.find(x=>String(x.id)===id);if(!e)return;ed=e;add='g';tab='add';armed=null;msg='';fl=true;draw();scrollTo(0,0)}
function drafts(){const L=D.filter(e=>e.t==='r');if(!L.length)return '';const now=new Date().toTimeString().slice(0,5);
 return `<div class="card"><b>⏳ Ganhos em andamento</b>${srt(L).map(e=>{const m=e.d===today()?mins(e.hi,now):0;return `<div class="row"><div>${oi(e.s)}${esc(e.s)}<small>${fd(e.d)} · início ${e.hi}${m?' · há '+fmtH(m):''}${e.vc?' · '+esc(e.vc):''}${e.ps>0?' · '+e.ps+' passageiro'+(e.ps>1?'s':''):''}</small></div><div style="text-align:right"><button class="del" style="color:var(--ac);margin-right:14px" onclick="finish('${e.id}')">Concluir</button><button class="del" onclick="del('${e.id}')">${armed==e.id?'Confirmar?':'Descartar'}</button></div></div>`}).join('')}</div>`}
function edit(id){const e=D.find(x=>String(x.id)===id);if(!e)return;ed=e;add=e.t;tab='add';armed=null;msg='';fl=true;draw();scrollTo(0,0)}
function fill(){if(!ed||tab!=='add')return;const g=id=>document.getElementById(id),set=(id,v)=>{if(g(id)&&v!=null&&v!=='')g(id).value=v};
 ['c','cb','vc'].forEach(i=>{const o=g(i),v=ed[i];if(o&&v&&![...o.options].some(x=>x.value===v))o.add(new Option(v,v))});
 set('d',ed.d);set('v',ed.v>0?m2(ed.v):null);set('p',ed.p?m2(ed.p):null);set('k',ed.k?ed.k.toFixed(1):null);set('kl',ed.kl?ed.kl.toFixed(1):null);set('s',ed.s);set('vc',ed.vc);set('ps',ed.ps);set('hi',ed.hi);set('hf',ed.hf);set('cb',ed.cb);set('c',ed.c);set('n',ed.n)}
function resumo(){const S=stats(),P=D.filter(inP),c=S.c,lucro=S.ganho-S.comb,total=lucro-S.desp;
 const seg=[['dia','Hoje'],['sem','Semana'],['mes','Mês'],['tudo','Tudo']].map(([k,t])=>`<button class="${per===k?'on':''}" onclick="per='${k}';pf=pt='';if(per==='mes')pm='';draw()">${t}</button>`).join('');
 const k=(t,v)=>`<div class="k"><small>${t}</small><b>${v}</b></div>`;
 const list=t=>srt(P.filter(e=>e.t===t)).map(e=>rowOf(e,0)).join('')||'<p class="hint">Nada neste período.</p>';
 const srcs=Object.entries(S.src).map(([n,v])=>`<div class="row"><span>${esc(n)}</span><b>${R(v)}</b></div>`).join('')||'<p class="hint">Nenhum ganho lançado neste período.</p>';
 const hbars=a=>{const m=Math.max(...a.map(x=>Math.abs(x[1])),0.0001);return a.map(([l,v,t,c])=>`<div class="hb"><span>${l}</span><div class="tr"><i style="width:${Math.abs(v)/m*100}%;background:${c}"></i></div><b>${t}</b></div>`).join('')};
 const pk=S.km>0,gkm=pk?S.ganho/S.km:0,ckm=c&&S.pl?S.pl/c:0,lkm=pk?total/S.km:0;
 const perkm=pk?hbars([['Ganho/km',gkm,R(gkm),'var(--ac)'],['Combustível/km',ckm,R(ckm),'var(--bad)'],['Lucro/km',lkm,R(lkm),lkm>=0?'var(--lu)':'var(--bad)']]):'<p class="hint">Informe os km rodados nos ganhos para ver.</p>';
 const org=Object.keys(S.src).length?hbars(Object.entries(S.src).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[oi(n)+esc(n),v,R(v),'var(--bl)'])):'<p class="hint">Nenhum ganho no período.</p>';
 const vv={};P.filter(e=>e.t==='g'&&e.vc).forEach(e=>vv[e.vc]=(vv[e.vc]||0)+e.v);
 const veh=Object.keys(vv).length?`<p class="hint" style="margin:12px 0 2px">Ganhos por veículo</p>`+hbars(Object.entries(vv).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[n,v,R(v),'var(--lu)'])):'';
 const gh=P.filter(e=>e.t==='g'&&e.hm>0),hmin=sum(gh,e=>e.hm),pax=sum(P.filter(e=>e.t==='g'&&e.ps>0),e=>e.ps);
 const ind=`<div class="card"><b>Indicadores</b><p class="hint" style="margin:8px 0 2px">R$ por km rodado</p>${perkm}<p class="hint" style="margin:12px 0 2px">Ganhos por origem</p>${org}${veh}<div class="grid" style="margin-top:12px">${k('Lucro por dia trabalhado',S.dias?R(total/S.dias):'—')}${k('Margem',S.ganho>0?N(total/S.ganho*100)+'%':'—')}${k('Consumo médio',c?N(c)+' km/L':'—')}${k('Preço médio do litro',S.pl?R(S.pl):'—')}${k('Km informados',pk?N(S.km,0)+' km':'—')}${k('Horas trabalhadas',hmin?fmtH(hmin):'—')}${k('Ganho por hora',hmin?R(sum(gh,e=>e.v)/hmin*60):'—')}${k('Passageiros',pax?N(pax,0):'—')}</div></div>`;
 const nd=D.filter(e=>e.t==='r').length,cur=today().slice(0,7),dt=new Date(PM()+'-01T12:00'),mn=dt.toLocaleDateString('pt-BR',{month:'long'}).toUpperCase()+(dt.getFullYear()!==new Date().getFullYear()?' '+dt.getFullYear():'');
 const bt={};P.filter(e=>e.t==='a').forEach(e=>{const n=e.cb||'Não informado';bt[n]=(bt[n]||0)+e.v});const btx=Object.keys(bt).some(n=>n!=='Não informado')?Object.entries(bt).map(([n,v])=>n+' '+R(v)).join(' · '):'';
 const dl=daily(P),wk=dl.filter(x=>x.g>0),best=wk.length?wk.reduce((a,b)=>b.l>a.l?b:a):null,worst=wk.length>1?wk.reduce((a,b)=>b.l<a.l?b:a):null,so=Object.entries(S.src).sort((a,b)=>b[1]-a[1])[0];
 const dk=(ic,t,x)=>x?`<div class="k"><small>${ic} ${t}</small><b class="${x.l>=0?'pos':'neg'}">${R(x.l)}</b><small>${wd(x.d)} ${fd(x.d)}</small></div>`:`<div class="k"><small>${ic} ${t}</small><b>—</b></div>`;
 return `${nd?`<div class="card" style="padding:10px 14px;border-color:var(--lu)" onclick="tab='add';draw()">⏳ ${nd} ganho${nd>1?'s':''} em andamento · toque para concluir</div>`:''}<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px"><button class="mn" onclick="mv(-1)">‹</button><b style="font-size:18px;letter-spacing:1px">${mn}</b><button class="mn" onclick="mv(1)" ${PM()>=cur?'disabled':''}>›</button></div>
 <div class="seg">${seg}</div>
 <div class="card" style="padding:8px 12px"><div style="display:flex;gap:8px;align-items:end"><div style="flex:1"><label style="margin:0 0 3px">📅 De</label><input type="date" value="${pf}" onchange="pf=this.value;sd()"></div><div style="flex:1"><label style="margin:0 0 3px">Até</label><input type="date" value="${pt}" onchange="pt=this.value;sd()"></div>${pf||pt?`<button class="del" style="padding:12px 4px" onclick="pf=pt='';sd()">Limpar</button>`:''}</div>
 <p class="hint" style="margin:6px 0 0">${per==='data'?(([a,b])=>'Mostrando '+(a===b?fd(a):fd(a)+' a '+fd(b)))(rng()):'Preencha só "De" para ver um dia, ou "De" e "Até" para vários dias.'}</p></div>
 <div class="card tot"><small class="hint">Lucro Líquido</small><div class="big ${total>=0?'pos':'neg'}">${R(total)}</div><div class="hint">${S.dias} dia(s) trabalhado(s)${S.dias?' · média '+R(total/S.dias)+'/dia':''}</div></div>
 <div class="grid"><div class="k"><small>💵 Receitas</small><b class="${lucro>=0?'bl':'neg'}">${R(lucro)}</b></div><div class="k"><small>🧾 Despesas</small><b class="neg">${R(S.desp)}</b></div>
 ${dk('🏆','Dia mais lucrativo',best)}${dk('📉','Dia de menor lucro',worst)}
 <div class="k"><small>🚕 Melhor origem</small><b>${so?oi(so[0])+esc(so[0]):'—'}</b><small>${so?R(so[1]):''}</small></div><div class="k"><small>⛽ Combustível gasto</small><b class="neg">${R(S.comb)}</b><small>${btx}</small></div></div>
 <div class="card"><b>Lucro por dia (R$)</b>${chart(dl)}</div>
 ${ind}
 ${acc('g','💰 Ganhos',R(S.ganho),'pos',list('g'))}
 ${acc('a','⛽ Abastecimentos',R(S.comb),'neg',list('a'))}
 ${acc('d','🧾 Despesas',R(S.desp),'neg',list('d'))}`}
function lancar(){
 const seg=[['g','💰 Ganho'],['a','⛽ Abastecer'],['d','🧾 Despesa']].map(([k,t])=>`<button class="${add===k?'on':''}" onclick="add='${k}';msg='';draw()">${t}</button>`).join('');
 let f='';
 if(add==='g')f=`<label>Origem</label>${og()}
  <div id="psw" style="display:${(ed?ed.s:'99')==='Viagem Intermunicipal'?'block':'none'}"><label>Número de passageiros</label><input id="ps" type="text" inputmode="numeric" placeholder="0" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
  <label>Veículo</label><select id="vc"><option>Carro</option><option>Moto</option></select>
  <label>Valor recebido (R$)</label><input id="v" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <div style="display:flex;gap:8px"><div style="flex:1"><label>Hora início</label><input id="hi" type="time" oninput="ch()"></div><div style="flex:1"><label>Hora fim</label><input id="hf" type="time" oninput="ch()"></div></div>
  <label>Horas trabalhadas (calculado)</label><input id="hm" type="text" placeholder="0h00" readonly>
  ${ed?'':`<button type="button" class="go" style="background:var(--card);color:var(--ac);border:1px solid var(--ac)" onclick="draft()">⏱️ Salvar só o início (rascunho)</button>`}
  <label>Km rodados (opcional)</label><input id="k" type="text" inputmode="numeric" placeholder="0000.0" oninput="mk(this,1,'.')" autocomplete="off">
  <label>Consumo médio nesta corrida (km/L)</label><input id="kl" type="text" inputmode="numeric" placeholder="00.0" oninput="mk(this,1,'.')" autocomplete="off">
  <label>Gasto com combustível (calculado)</label><input id="gc" type="text" placeholder="0,00" readonly>
  <label>Lucro nesta corrida (calculado)</label><input id="lc" type="text" placeholder="0,00" readonly>
  <p class="hint" id="gh"></p>`;
 if(add==='a')f=`<label>Combustível</label><select id="cb"><option>Gasolina Comum</option><option>Gasolina Aditivada</option><option>Etanol</option></select>
  <label>Preço do litro (R$)</label><input id="p" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <label>Valor abastecido (R$)</label><input id="v" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <label>Litros abastecidos (calculado)</label><input id="lt" type="text" placeholder="00.00" readonly>`;
 if(add==='d')f=`<label>Categoria</label><select id="c"><option>Manutenção</option><option>Lavagem</option><option>Pedágio</option><option>Alimentação</option><option>Parcela/Aluguel</option><option>Seguro/IPVA</option><option>Outro</option></select>
  <label>Valor (R$)</label><input id="v" type="text" inputmode="numeric" placeholder="0,00" oninput="mk(this,2,',')" autocomplete="off">
  <label>Observação</label><input id="n" type="text">`;
 return `${ed?'':drafts()}${ed?'':`<div class="seg">${seg}</div>`}<div class="card">${ed?(ed.t==='r'?'<b>✅ Concluir ganho em andamento</b>':'<b>✏️ Editando lançamento</b>'):''}<label>Data</label><input id="d" type="date" value="${today()}">${f}
 <button class="go" onclick="addIt()">${ed?(ed.t==='r'?'Concluir ganho':'Salvar alterações'):'Salvar'}</button>${ed?`<button class="go" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="tab='${ed.t==='r'?'add':'his'}';ed=null;draw()">Cancelar</button>`:''}<p class="hint" id="msg">${msg}</p></div>`}
function addIt(){const e={ts:ed?ed.ts:Date.now(),t:add,d:document.getElementById('d').value||today(),v:num('v')};
 if(e.v<=0){return bad('Informe o valor.')}
 if(add==='g'){e.s=document.getElementById('s').value;e.k=num('k');e.kl=num('kl');e.vc=document.getElementById('vc').value;if(e.s==='Viagem Intermunicipal'){const n=parseInt(document.getElementById('ps').value)||0;if(n>0)e.ps=n}{const hi=document.getElementById('hi').value,hf=document.getElementById('hf').value;if(hi&&hf){e.hi=hi;e.hf=hf;e.hm=mins(hi,hf)}}const p=ed?priceAt(e.d):lastP();if(p>0&&e.k>0&&e.kl>0){e.pl=p;e.gc=+(e.k/e.kl*p).toFixed(2);e.lc=+(e.v-e.gc).toFixed(2)}}
 if(add==='a'){e.p=num('p');e.cb=document.getElementById('cb').value;if(e.p<=0){return bad('Informe o preço do litro.')}}
 if(add==='d'){e.c=document.getElementById('c').value;e.n=document.getElementById('n').value}
 if(ed){e.id=ed.id;D=D.map(x=>x.id===e.id?e:x);col.doc(e.id).set(e).catch(x=>{err=fe(x);draw()});ed=null;tab='his';msg='';return draw()}
 const ref=col.doc();e.id=ref.id;D.push(e);ref.set(e).catch(x=>{err=fe(x);draw()});msg='✔ Salvo!';
 if(add==='a'){msg+=` ${N(e.v/e.p,2)} L`}
 draw()}
function hist(){const rows=srt(D.filter(e=>e.t!=='r')).slice(0,100).map(e=>rowOf(e,1)).join('')||'<p class="hint">Sem lançamentos ainda.</p>';
 return `<div class="card">${rows}</div>`}
function del(id){if(armed==id){D=D.filter(e=>String(e.id)!==id);col.doc(id).delete();armed=null}else armed=id;draw()}
function draw(){
 const so=document.getElementById('so');if(so)so.hidden=!user;
 if(!ready){document.getElementById('view').innerHTML='<p class="hint">Carregando…</p>';return}
 if(!user){document.getElementById('tabs').innerHTML='';document.getElementById('view').innerHTML=login();return}
 const IC={res:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',add:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',his:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
 document.getElementById('tabs').innerHTML=[['res','Painel'],['add','Lançamentos'],['his','Histórico']].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';armed=null;ed=null;draw()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${t}</button>`).join('');
 document.getElementById('view').innerHTML=(err?`<div class="card neg">⚠ ${esc(err)}</div>`:'')+(tab==='res'?resumo():tab==='add'?lancar():hist());if(fl){fl=false;fill()}{const c=document.getElementById('cs');if(c)c.scrollLeft=1e5}cl()}
draw();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
